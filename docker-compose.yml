version: '3.9'
services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zeeh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
  mock-bureau:
    image: node:20-alpine
    working_dir: /mock
    volumes:
      - ./tests/mocks:/mock
    command: ["node", "bureau-mock.js"]
    ports:
      - "4000:4000"
volumes:
  pgdata:
