name: ci
on:
  push:
    branches: [ main, master ]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeeh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zeeh_test
      BUREAU_API_URL: http://localhost:4000
      BUREAU_API_KEY: test-key
      JWT_SECRET: test-secret-key
      LOG_LEVEL: error
      NODE_ENV: test
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
      - run: sleep 5
      - run: npm run build --if-present
      - run: npm test
